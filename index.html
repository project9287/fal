<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Prototype - Sequential Poems & 3D</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        
        /* ICONO PERMANENTE EN LA ESQUINA */
        .icono-esquina {
            position: fixed; 
            top: 20px;
            right: 20px;
            width: 40px; 
            height: auto;
            z-index: 10000; 
        }

        /* DISEÑO DE LA PANTALLA DE CARGA */
        #pantalla-carga {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            z-index: 9999; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-centro {
            width: 150px; 
            height: auto;
            margin-bottom: 20px;
        }

        .titulo-carga {
            font-size: 16px; 
            color: #000;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .subtitulo-carga {
            font-size: 8px; 
            color: #777777;
            font-style: italic;
        }

        /* DISEÑO DEL POEMA */
        #interfaz-poema {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.6); 
            color: #000;
            padding: 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 18px; 
            line-height: 1.5;
            font-weight: 500;
            z-index: 999;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.15);
            text-align: center;
            display: none; 
        }

        .instrucciones {
            font-size: 14px; 
            color: #777777; 
            font-style: italic; 
            display: block;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <!-- IMÁGENES -->
    <img src="icono.jpeg" alt="Icon" class="icono-esquina">

    <div id="pantalla-carga">
        <img src="logo.jpeg" alt="Logo" class="logo-centro">
        <div class="titulo-carga">Ask a question, and select 3 cards from the deck.</div>
        <div class="subtitulo-carga">Read them in the order they appear.</div>
    </div>

    <div id="interfaz-poema"><span class="instrucciones">Looking for cards...</span></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <!-- CARTA 1: Nuevas rutas para project9287/fal -->
        <a-nft type="nft" url="https://project9287.github.io/fal/marcadores/carta1" id="carta-1" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-entity gltf-model="url(https://project9287.github.io/fal/modelos/animacion1.glb)" animation-mixer="loop: repeat" scale="300 300 300" position="150 0 -250"></a-entity>
        </a-nft>

        <!-- CARTA 2 -->
        <a-nft type="nft" url="https://project9287.github.io/fal/marcadores/carta2" id="carta-2" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-entity gltf-model="url(https://project9287.github.io/fal/modelos/animacion2.glb)" animation-mixer="loop: repeat" scale="300 300 300" rotation="-90 0 0" position="250 0 -150"></a-entity>
        </a-nft>

        <!-- CARTA 3 -->
        <a-nft type="nft" url="https://project9287.github.io/fal/marcadores/carta3" id="carta-3" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-entity gltf-model="url(https://project9287.github.io/fal/modelos/animacion3.glb)" animation-mixer="loop: repeat" scale="300 300 300" rotation="-90 0 0" position="250 0 -150"></a-entity>
        </a-nft>

        <!-- CARTA 4 -->
        <a-nft type="nft" url="https://project9287.github.io/fal/marcadores/carta4" id="carta-4" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-entity gltf-model="url(https://project9287.github.io/fal/modelos/animacion4.glb)" animation-mixer="loop: repeat" scale="300 300 300" rotation="-90 0 0" position="250 0 -150"></a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="script.js"></script>

    <script>
        window.addEventListener('arjs-nft-loaded', function () {
            let loader = document.getElementById('pantalla-carga');
            if (loader) {
                setTimeout(() => {
                    loader.style.transition = "opacity 0.5s ease";
                    loader.style.opacity = "0";
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                }, 7000);
            }
        });
    </script>
</body>
</html>
